<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const savedTheme = localStorage.getItem('aero_theme');
    if (savedTheme) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `../themes/${savedTheme}.css`;
      document.head.appendChild(link);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - Requests</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body {
      height: auto !important;
      min-height: 100vh !important;
      overflow: auto !important;
      position: static !important;
    }
    .requests-container {
      max-width: 800px;
      width: 100%;
      margin: 90px auto 40px auto;
      padding: 24px;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .requests-header {
      margin-bottom: 30px;
    }
    .requests-header h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--theme-color, #0b57d0);
    }
    .request-form-card {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 32px;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group input, 
    .form-group textarea {
      padding: 12px 16px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      background-color: #ffffff;
      color: #1f1f1f;
      width: 100%;
      box-sizing: border-box;
    }
    .submit-request-btn {
      background-color: var(--theme-color, #0b57d0);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .submit-request-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="requests-container">
    <div class="requests-header">
      <h1>Project Requests</h1>
      <p>Submit your ideas and features directly to our system.</p>
    </div>

    <div class="request-form-card">
      <form id="project-request-form">
        <div class="form-group">
          <label for="discordUser">Discord Username</label>
          <input type="text" id="discordUser" name="discordUser" required placeholder="e.g. username#0000">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="projectTitle">Project Type / Title</label>
          <input type="text" id="projectTitle" name="projectTitle" required placeholder="e.g. Website / Minecraft Plugin">
        </div>

        <div class="form-group">
          <label for="promoCode">Promo Code (Optional)</label>
          <input type="text" id="promoCode" name="promoCode" placeholder="Enter promo code if you have one">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required placeholder="Describe what you need..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-request-btn">Submit Request</button>
      </form>
      <a href="status.html" class="submit-request-btn" style="display: block; text-align: center; text-decoration: none; margin-top: 12px; background-color: #f0f4f9; color: var(--theme-color, #0b57d0); border: 1px solid #dadce0;">View Request Queue</a>
    </div>
  </div>

  <script>
    fetch('../navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading navbar:', error));

    document.getElementById('project-request-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const discordUser = document.getElementById('discordUser').value;
      const email = document.getElementById('email').value;
      const projectTitle = document.getElementById('projectTitle').value;
      const promoCode = document.getElementById('promoCode').value || "None provided";
      const description = document.getElementById('description').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.textContent = 'Submitting...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discordUser, email, projectTitle, promoCode, description })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Request submitted successfully to Discord!');
          document.getElementById('project-request-form').reset();
        } else {
          alert('Failed to post: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error connecting to server.');
      } finally {
        submitBtn.textContent = 'Submit Request';
        submitBtn.disabled = false;
      }
    });
  </script>
  <script src="../version.js"></script>
</body>
</html>
