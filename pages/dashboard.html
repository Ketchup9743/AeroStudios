<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - Client Portal</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main style="max-width: 500px; text-align: left; margin: 4rem auto; padding: 0 1rem;">
    <div style="background: #ffffff; padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color, #ccc); color: #000;">
      <h2 style="margin-bottom: 1rem; color: #000;">Client Portal Access</h2>
      
      <div id="login-section">
        <p style="color: #555; margin-bottom: 1.5rem;">Enter your access token to view your project dashboard.</p>
        <form id="token-form">
          <input type="text" id="token-input" placeholder="Enter Token (e.g., AERO-1234-XYZ)" required style="width: 100%; padding: 0.75rem; background: #f9f9f9; border: 1px solid #ccc; color: #000; border-radius: 6px; margin-bottom: 1rem; box-sizing: border-box;">
          <button type="submit" style="width: 100%; padding: 0.75rem; background: var(--accent-primary, #3b82f6); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Access Dashboard</button>
        </form>
      </div>

      <div id="dashboard-view" style="display: none;">
        <h3 id="status-title" style="color: var(--accent-primary, #3b82f6); margin-bottom: 0.5rem;"></h3>
        <p id="status-desc" style="color: #555; font-size: 0.9rem; margin-bottom: 1.5rem;"></p>
        <div style="background: #f9f9f9; padding: 1rem; border-radius: 6px; border: 1px solid #ccc;">
          <p style="color: #000;"><strong>Client:</strong> <span id="client-name"></span></p>
          <p style="color: #000;"><strong>Current Milestone:</strong> <span id="milestone"></span></p>
          <p style="color: #000;"><strong>Estimated Completion:</strong> <span id="completion"></span></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    fetch('../navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
      });

    document.getElementById('token-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token-input').value.trim();
      
      try {
        const response = await fetch('../projects.json');
        const projects = await response.json();
        
        if (projects[token]) {
          const data = projects[token];
          document.getElementById('client-name').textContent = data.clientName;
          document.getElementById('milestone').textContent = data.milestone;
          document.getElementById('completion').textContent = data.completion;
          document.getElementById('status-title').textContent = data.statusTitle;
          document.getElementById('status-desc').textContent = data.statusDesc;
          
          document.getElementById('login-section').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'block';
        } else {
          alert('Invalid or unknown token.');
        }
      } catch (err) {
        alert('Could not load project data.');
      }
    });
  </script>
</body>
</html>
