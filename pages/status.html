<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const savedTheme = localStorage.getItem('aero_theme');
    if (savedTheme) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `themes/${savedTheme}.css`;
      document.head.appendChild(link);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - System Status</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: auto !important;
      min-height: 100vh !important;
      overflow: auto !important;
      position: static !important;
    }
    .status-container {
      margin-top: 100px !important;
      margin-bottom: 60px !important;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
    }
    .status-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .status-item:last-child {
      border-bottom: none;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #137333;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #137333;
      border-radius: 50%;
    }
    .queue-entry {
      padding: 10px 14px;
      background: #f0f4f9;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      border: 1px solid #e0e0e0;
      color: #1f1f1f;
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="status-container">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1>System Status</h1>
      <p style="color: #444746; font-size: 0.95rem;">Current status and live request queue.</p>
    </div>

    <div class="status-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 1.1rem; margin: 0;">Request Queue Status</h2>
        <span id="queue-count" style="font-size: 0.85rem; background: #e0f2fe; color: var(--theme-color, #0b57d0); padding: 4px 10px; border-radius: 20px; font-weight: 500;">Loading...</span>
      </div>
      <div id="queue-list">
        <p style="color: #444746; font-size: 0.95rem; margin: 0;">Loading queue data...</p>
      </div>
    </div>

    <div class="status-card">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
        <span class="badge-dot" style="width: 12px; height: 12px;"></span>
        <h2 style="font-size: 1.2rem; color: #137333; margin: 0;">All Systems Operational</h2>
      </div>
      <p style="color: #444746; font-size: 0.95rem; margin: 0;">Every core service is running smoothly with no reported downtime.</p>
    </div>

    <div class="status-card">
      <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Service Breakdown</h2>
      
      <div class="status-item">
        <span>AI Chatbot</span>
        <div class="badge"><span class="badge-dot"></span> Operational</div>
      </div>
      <div class="status-item">
        <span>Request Page</span>
        <div class="badge"><span class="badge-dot"></span> Operational</div>
      </div>
      <div class="status-item">
        <span>Theme & Settings</span>
        <div class="badge"><span class="badge-dot"></span> Operational</div>
      </div>
    </div>
  </div>

  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

    fetch('queue.json')
      .then(response => response.json())
      .then(data => {
        const queueListContainer = document.getElementById('queue-list');
        const queueCountSpan = document.getElementById('queue-count');
        
        const queue = data.queue || [];
        queueCountSpan.textContent = `${queue.length} in Queue`;

        if (queue.length === 0) {
          queueListContainer.innerHTML = '<p style="color: #444746; font-size: 0.95rem; margin: 0;">No current requests</p>';
          return;
        }

        queueListContainer.innerHTML = '';
        queue.forEach(entry => {
          const div = document.createElement('div');
          div.className = 'queue-entry';
          div.innerHTML = `<strong>${entry.username}</strong> - ${entry.item} - <span style="color: var(--theme-color, #0b57d0);">ETA: ${entry.eta}</span>`;
          queueListContainer.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('queue-list').innerHTML = '<p style="color: #d93025; font-size: 0.95rem; margin: 0;">Unable to load queue data.</p>';
        document.getElementById('queue-count').textContent = 'Error';
      });
  </script>
  <script src="version.js"></script>
</body>
</html>
