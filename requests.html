<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - Requests</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <div class="logo-container">
      <span class="logo-text">Aero AI</span>
    </div>
    <nav class="nav-links">
      <a href="/" class="nav-btn">Home</a>
      <a href="/requests" class="nav-btn">Requests</a>
      <a href="#" class="nav-btn">Support</a>
    </nav>
  </header>

  <div class="requests-container">
    <div class="requests-header">
      <h1>Project Requests</h1>
      <p>Submit your ideas and features directly to our system.</p>
    </div>

    <div class="request-form-card">
      <form action="/api/request" method="POST">
        <div class="form-group">
          <label for="projectName">Project Name</label>
          <input type="text" id="projectName" name="projectName" required placeholder="Enter project name">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required placeholder="Describe what you need..."></textarea>
        </div>
        <button type="submit" class="submit-request-btn">Submit Request</button>
      </form>
    </div>
  </div>

</body>
</html>
