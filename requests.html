<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - Requests</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: auto !important;
      min-height: 100vh !important;
      overflow: auto !important;
      position: static !important;
    }
    .requests-container {
      margin-top: 100px !important;
      margin-bottom: 60px !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="logo-container">
      <span class="logo-text">Aero AI</span>
    </div>
    <nav class="nav-links">
      <a href="/" class="nav-btn">Home</a>
      <a href="/requests" class="nav-btn" style="background-color: #f0f4f9;">Requests</a>
      <a href="/support" class="nav-btn">Support</a>
    </nav>
  </header>

  <div class="requests-container">
    <div class="requests-header">
      <h1>Project Requests</h1>
      <p>Submit your ideas and features directly to our system.</p>
    </div>

    <div class="request-form-card">
      <form id="project-request-form">
        <div class="form-group">
          <label for="discordUser">Discord Username</label>
          <input type="text" id="discordUser" name="discordUser" required placeholder="e.g. username#0000">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="projectTitle">Project Type / Title</label>
          <input type="text" id="projectTitle" name="projectTitle" required placeholder="e.g. Website / Minecraft Plugin">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required placeholder="Describe what you need..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-request-btn">Submit Request</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('project-request-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const discordUser = document.getElementById('discordUser').value;
      const email = document.getElementById('email').value;
      const projectTitle = document.getElementById('projectTitle').value;
      const description = document.getElementById('description').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.textContent = 'Submitting...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discordUser, email, projectTitle, description })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Request submitted successfully to Discord!');
          document.getElementById('project-request-form').reset();
        } else {
          alert('Failed to post: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error connecting to server.');
      } finally {
        submitBtn.textContent = 'Submit Request';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
