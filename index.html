<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const savedTheme = localStorage.getItem('aero_theme');
    if (savedTheme) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `themes/${savedTheme}.css`;
      document.head.appendChild(link);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="chat-wrapper" id="chatWrapper">
    <div class="chat-container" id="chatContainer">
      <div class="welcome-banner" id="welcomeBanner">
        <h1>What can I help you build?</h1>
      </div>
      <div class="message ai-message">
        Hello! Welcome to Aero Studios. How can I help you today?
      </div>
    </div>
  </div>

  <div class="input-container">
    <button class="upload-btn" title="Upload Image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </button>
    <input type="text" class="chat-input" id="chatInput" placeholder="Ask Aero AI...">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });

    const chatWrapper = document.getElementById('chatWrapper');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeBanner = document.getElementById('welcomeBanner');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, isUser = false) {
      if (welcomeBanner) {
        welcomeBanner.style.display = 'none';
      }
      chatWrapper.classList.add('active');

      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      msgDiv.classList.add(isUser ? 'user-message' : 'ai-message');
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      if (welcomeBanner) welcomeBanner.style.display = 'none';
      chatWrapper.classList.add('active');

      const typingDiv = document.createElement('div');
      typingDiv.classList.add('typing-indicator');
      typingDiv.id = 'typingIndicator';
      
      typingDiv.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;
      
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const typingDiv = document.getElementById('typingIndicator');
      if (typingDiv) {
        typingDiv.remove();
      }
    }

    sendBtn.addEventListener('click', async () => {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, true);
      chatInput.value = '';

      showTypingIndicator();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        removeTypingIndicator();
        addMessage(data.reply || data.response || "No response received.");
      } catch (error) {
        removeTypingIndicator();
        addMessage("Error connecting to server.");
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
  <script src="version.js"></script>
</body>
</html>
