<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aero Studios - AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13" />
          <path d="M22 2L15 22L11 13L2 9L22 2Z" />
        </svg>
      </div>
      <span class="brand-name">Aero AI</span>
    </div>
    <nav class="nav-links">
      <a href="#home" class="nav-btn active">Home</a>
      <a href="#requests" class="nav-btn">Requests</a>
      <a href="#support" class="nav-btn">Support</a>
    </nav>
  </header>
  <main class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="message ai-message">
        <div class="avatar">AI</div>
        <div class="message-content">Hello! How can I assist you with Aero Studios today?</div>
      </div>
    </div>
    <div class="chat-input-area" id="inputArea">
      <form id="chatForm" class="input-wrapper">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />
        <button type="button" class="upload-btn" id="uploadBtn" aria-label="Upload Image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <input type="text" id="userInput" placeholder="Ask Aero AI something..." autocomplete="off" required />
        <button type="submit" class="send-btn" aria-label="Send Message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="input-hint">Aero AI is currently in beta, mske sure to verify any info</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
