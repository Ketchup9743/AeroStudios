<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios - AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="logo-container">
      <span class="logo-text">Aero AI</span>
    </div>
    <nav class="nav-links">
      <a href="/" class="nav-btn">Home</a>
      <a href="/requests" class="nav-btn">Requests</a>
      <a href="#" class="nav-btn">Support</a>
    </nav>
  </header>
  <div class="chat-wrapper" id="chatWrapper">
    <div class="chat-container" id="chatContainer">
      <div class="welcome-banner" id="welcomeBanner">
        <h1>What can I help you build?</h1>
      </div>
      <div class="message ai-message">
        Hello! Welcome to Aero Studios. How can I help you today?
      </div>
    </div>
  </div>


  <div class="input-container">
    <button class="upload-btn" title="Upload Image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </button>
    <input type="text" class="chat-input" id="chatInput" placeholder="Ask Aero AI...">
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <script>
    const chatWrapper = document.getElementById('chatWrapper');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeBanner = document.getElementById('welcomeBanner');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, isUser = false) {
      if (welcomeBanner) {
        welcomeBanner.style.display = 'none';
      }
      chatWrapper.classList.add('active');

      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      msgDiv.classList.add(isUser ? 'user-message' : 'ai-message');
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    sendBtn.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, true);
      chatInput.value = '';

      setTimeout(() => {
        addMessage("I'm processing your request for Aero Studios!");
      }, 600);
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>

</body>
</html>
