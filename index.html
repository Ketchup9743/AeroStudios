<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Studios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <div class="logo-container">
      <span class="logo-text">Aero Studios</span>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="requests.html" class="nav-btn">Requests</a>
      <a href="#" class="nav-btn">Support</a>
    </nav>
  </header>

  <div class="chat-container">
    <div class="welcome-section">
      <h1 class="welcome-title">Hello, creator.</h1>
      <p class="welcome-subtitle">How can I help you build today?</p>
    </div>
    
    <div class="message ai-message">
      Welcome to Aero Studios. Ask me anything or upload a design to get started.
    </div>
  </div>

  <div class="input-container">
    <button class="upload-btn" title="Upload Image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </button>
    <input type="text" class="chat-input" placeholder="Enter a prompt here...">
    <button class="send-btn">Send</button>
  </div>

</body>
</html>
