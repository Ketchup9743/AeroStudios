<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  const savedTheme = localStorage.getItem('aero_theme');
  if (savedTheme) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `themes/${savedTheme}.css`;
    document.head.appendChild(link);
  }
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Aero Studios</title>
    <script>
      const savedTheme = localStorage.getItem('aero_theme');
      if (savedTheme === 'blue-white') {
        document.documentElement.style.backgroundColor = '#f8f9fa';
      } else if (savedTheme === 'green-white') {
        document.documentElement.style.backgroundColor = '#f4fbf7';
      } else if (savedTheme === 'orange-white') {
        document.documentElement.style.backgroundColor = '#fffdf7';
      } else if (savedTheme === 'magenta-black') {
        document.documentElement.style.backgroundColor = '#121212';
      }
    </script>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: inherit;
        }

        p {
            font-size: 1.25rem;
            font-weight: 500;
            color: #0066ff;
            margin: 0 0 24px 0;
        }

        a.home-btn {
            display: inline-block;
            background-color: #0066ff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        a.home-btn:hover {
            background-color: #0052cc;
        }

        #version-container {
            position: absolute;
            bottom: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            color: #888888;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Aero Studios</h1>
    <p>Page Not Found</p>
    <a href="/" class="home-btn">Go Back Home</a>
    <a id="version-container" href="patch.html"></a>

    <script>
      const savedTheme = localStorage.getItem('aero_theme');
      if (savedTheme === 'blue-white') {
        document.body.style.backgroundColor = '#f8f9fa';
        document.body.style.color = '#202124';
      } else if (savedTheme === 'green-white') {
        document.body.style.backgroundColor = '#f4fbf7';
        document.body.style.color = '#137333';
      } else if (savedTheme === 'orange-white') {
        document.body.style.backgroundColor = '#fffdf7';
        document.body.style.color = '#e37400';
      } else if (savedTheme === 'magenta-black') {
        document.body.style.backgroundColor = '#121212';
        document.body.style.color = '#e8eaed';
      }
    </script>
    <script src="version.js"></script>
</body>
</html>
