<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const savedTheme = localStorage.getItem('aero_theme');
    if (savedTheme) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `themes/${savedTheme}.css`;
      document.head.appendChild(link);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Aero Studios</title>
  <style>
      body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          height: 100vh;
          margin: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          padding: 20px;
          box-sizing: border-box;
          position: relative;
      }

      h1 {
          font-size: 2rem;
          font-weight: 700;
          margin: 0 0 10px 0;
          color: inherit;
      }

      p {
          font-size: 1.25rem;
          font-weight: 500;
          color: #0066ff;
          margin: 0 0 24px 0;
      }

      a.home-btn {
          display: inline-block;
          background-color: #0066ff;
          color: #ffffff;
          text-decoration: none;
          padding: 10px 20px;
          border-radius: 6px;
          font-weight: 600;
          transition: background-color 0.2s;
      }

      a.home-btn:hover {
          background-color: #0052cc;
      }

      #version-container {
          position: absolute;
          bottom: 20px;
          text-decoration: none;
          font-size: 0.85rem;

          cursor: pointer;
      }
  </style>
</head>
<body>
